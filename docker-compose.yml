# version: '3.8'

services:
  slskd:
    image: slskd/slskd
    container_name: slskd
    restart: always
    environment:
      - TZ=Europe/Bratislava
    volumes:
      - ./slskd/config/slskd.yml:/app/slskd.yml
      - /Volumes/DeliRAID5/Downloads/_Soulseek:/downloads
      - /Volumes/DeliRAID5/Media/Music/Music/Various Artists:/shares/VariousArtists:ro  # Share music library for Soulseek users
    ports:
      - "5030:5030"
      - "5031:5031"

  bridge:
    build: ./bridge
    container_name: spotify-soulseek-bridge
    restart: always
    environment:
      - TZ=Europe/Bratislava
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./bridge/main.py:/app/main.py
      - /Volumes/DeliRAID5/Media/Music:/music
      - /Volumes/DeliRAID5/Downloads:/downloads
      - ./data:/app/data
    depends_on:
      - slskd
    stdin_open: true
    tty: true
